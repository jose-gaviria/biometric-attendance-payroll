name: checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  face-lab:
    name: Face lab (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  attendance:
    name: Attendance and payroll (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: turnos-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: turnos-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  face-engine:
    name: Face engine (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: face-service/requirements.lock
      - run: python -m pip install --requirement face-service/requirements.lock
      # Weights are not vendored. This downloads them from the pinned upstream
      # revisions and fails if any SHA-256 differs from the manifest.
      - run: python scripts/prepare-models.py
      # The engine's own suite: it serves the models over loopback and receives
      # the public test fixtures through stdin, exactly as the container harness does.
      - name: Run face engine tests
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 5001 --no-access-log &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5001/health > /dev/null && break
            sleep 1
          done
          python - <<'PY' > "$RUNNER_TEMP/fixtures.json"
          import base64, json, pathlib
          root = pathlib.Path('..')
          print(json.dumps({
              'a': base64.b64encode((root / 'tests/fixtures/astronaut.png').read_bytes()).decode(),
              'b': base64.b64encode((root / 'tests/fixtures/grace_hopper.jpg').read_bytes()).decode(),
          }))
          PY
          python tests/test_engine.py -v < "$RUNNER_TEMP/fixtures.json"
        working-directory: face-service
